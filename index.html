<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPost — Multi-Platform Content Syndication</title>
    <meta name="description" content="Discover articles from RSS, Atom, and sitemaps, generate platform-native captions with Gemini, render 1200x630 thumbnails, and publish across 11 social APIs." />
    <meta property="og:title" content="AutoPost — Multi-Platform Content Syndication" />
    <meta property="og:description" content="Discover articles from RSS, Atom, and sitemaps, generate platform-native captions with Gemini, render 1200x630 thumbnails, and publish across 11 social APIs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <!-- gh-root-fallback:start -->
    <script>
      (function () {
        var loaded = false;
        window.__loadStaticApp = function () {
          if (loaded || window.__AUTOPOST_MOUNTED__) return;
          loaded = true;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './static-app/app.css';
          document.head.appendChild(link);
          var script = document.createElement('script');
          script.type = 'module';
          script.src = './static-app/app.js';
          document.body.appendChild(script);
        };
        if (/\.github\.io$/i.test(window.location.hostname) || window.location.protocol === 'file:') {
          window.__loadStaticApp();
        } else {
          setTimeout(function () {
            if (!window.__AUTOPOST_MOUNTED__) window.__loadStaticApp();
          }, 400);
        }
      })();
    </script>
    <!-- gh-root-fallback:end -->
    <script type="module" src="/src/main.tsx" onerror="window.__loadStaticApp && window.__loadStaticApp()"></script>
  </body>
</html>
